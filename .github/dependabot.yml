version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - septa-cr
    versioning-strategy: increase
    # Wait 7 days after a release before proposing it (reduces supply chain risk)
    cooldown:
      default-days: 7
    # Major versions of @types/node must match the supported Node.js versions, do not update them automatically
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - septa-cr
    cooldown:
      default-days: 7
